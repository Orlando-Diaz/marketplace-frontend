<section class="catalogo">
  <h1>Catálogo</h1>

  @if (cargando()) {
    <p class="info">Cargando productos...</p>
  } @else if (error()) {
    <p class="error">{{ error() }}</p>
  } @else if (productos().length === 0) {
    <p class="info">Aún no hay productos publicados.</p>
  } @else {
    <div class="grilla">
      @for (p of productos(); track p.id) {
        <app-producto-card [producto]="p" />
      }
    </div>

    <div class="paginacion">
      <button [disabled]="pagina() === 0" (click)="cargar(pagina() - 1)">← Anterior</button>
      <span>Página {{ pagina() + 1 }} de {{ totalPaginas() }}</span>
      <button [disabled]="pagina() + 1 >= totalPaginas()" (click)="cargar(pagina() + 1)">Siguiente →</button>
    </div>
  }
</section>
