<div class="contenedor">
  <form class="tarjeta" [formGroup]="form" (ngSubmit)="enviar()">
    <h2>Iniciar sesión</h2>

    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <small class="error">Ingresa un email válido</small>
    }

    <label for="password">Contraseña</label>
    <input id="password" type="password" formControlName="password" />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <small class="error">La contraseña es obligatoria</small>
    }

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
    </button>

    <p class="enlace">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
  </form>
</div>
